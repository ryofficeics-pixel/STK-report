const ID_ONES={"nol":0,"satu":1,"dua":2,"tiga":3,"empat":4,"lima":5,"enam":6,"tujuh":7,"delapan":8,"sembilan":9};
const VOICE_KNOWN_UNITS=["sak","zak","kg","kilogram","gram","ton","kubik","m3","meter","m","m2","liter","batang","buah","unit","dus","karung","karton","drum","roll","lembar","set","pcs","biji","kaleng","galon","kantong","gulung","botol","ember"];
function parseIndoNumberSequence(tokens,start){let i=start,total=0,current=0,matched=false;while(i<tokens.length){const t=tokens[i];if(t==="seratus"){current+=100;matched=true;i++;continue}if(t==="sepuluh"){current+=10;matched=true;i++;continue}if(t==="sebelas"){current+=11;matched=true;i++;continue}if(t==="seribu"){total+=1000;current=0;matched=true;i++;continue}if(t==="koma"&&matched){let frac="",j=i+1;while(j<tokens.length&&ID_ONES[tokens[j]]!==undefined){frac+=String(ID_ONES[tokens[j]]);j++}if(!frac&&/^\d+$/.test(tokens[j]||""))  {frac=tokens[j];j++}if(frac)return{value:parseFloat(`${total+current}.${frac}`),next:j};break}if(ID_ONES[t]!==undefined){const val=ID_ONES[t],nxt=tokens[i+1];if(nxt==="belas"){current+=10+val;matched=true;i+=2;continue}if(nxt==="puluh"){current+=val*10;matched=true;i+=2;continue}if(nxt==="ratus"){current+=val*100;matched=true;i+=2;continue}if(nxt==="ribu"){total+=val*1000;current=0;matched=true;i+=2;continue}current+=val;matched=true;i++;continue}break}if(!matched)return null;return{value:total+current,next:i}}
function capitalizeWords(s){return s.replace(/\b\w/g,c=>c.toUpperCase())}
const VOICE_FILLER_WORDS=["kira kira","kira-kira","kayaknya","sekitarnya","sekitar","tadi","kita","masukin","udah","sudah","nih","yah","gitu","deh","sih","kemarin","hari ini","kali ini","barusan","habis itu","abis itu","kayak","kalo","kalau","ini","itu"];
function stripVoiceFillers(text){let t=" "+text.toLowerCase()+" ";VOICE_FILLER_WORDS.forEach(w=>{t=t.split(" "+w+" ").join(" ")});return t.trim().replace(/\s+/g," ")}
function parseVoiceItemSegment(text){const cleaned=stripVoiceFillers(text);const tokens=cleaned.trim().toLowerCase().replace(/[.]/g,"").split(/\s+/).filter(Boolean);let qty=null,qtyStart=-1,qtyEnd=-1;for(let i=0;i<tokens.length;i++){const numMatch=tokens[i].replace(",",".");if(/^\d+(\.\d+)?$/.test(numMatch)){qty=parseFloat(numMatch);qtyStart=i;qtyEnd=i+1;break}const wordNum=parseIndoNumberSequence(tokens,i);if(wordNum){qty=wordNum.value;qtyStart=i;qtyEnd=wordNum.next;break}}if(qty===null)return null;const beforeTokens=tokens.slice(0,qtyStart);const afterTokens=tokens.slice(qtyEnd);if(beforeTokens.length){const name=beforeTokens.join(" ").trim();const unit=afterTokens[0]||"";return{name:capitalizeWords(name),qty,unit}}if(afterTokens.length){let unit="",nameTokens=afterTokens;if(VOICE_KNOWN_UNITS.includes(afterTokens[0])){unit=afterTokens[0];nameTokens=afterTokens.slice(1)}const name=nameTokens.join(" ").trim();if(!name)return null;return{name:capitalizeWords(name),qty,unit}}return null}
function splitVoiceSegments(transcript){return transcript.split(/,|\bdan\b|\bterus\b|\blalu\b|\bkemudian\b|\bserta\b/gi).map(s=>s.trim()).filter(Boolean)}
function parseVoiceItems(transcript){const segments=splitVoiceSegments(transcript);const parsed=[],skipped=[];segments.forEach(seg=>{const item=parseVoiceItemSegment(seg);if(item)parsed.push(item);else if(seg)skipped.push(seg)});return{parsed,skipped}}
let voiceRecognition=null,voiceFinalTranscript="",voiceTargetKind=null;
function voiceSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function startVoiceFill(kind){if(!voiceSupported()){alert("Fitur suara tidak didukung di browser ini. Gunakan Google Chrome untuk fitur ini.");return}voiceTargetKind=kind;voiceFinalTranscript="";const SR=window.SpeechRecognition||window.webkitSpeechRecognition;voiceRecognition=new SR();voiceRecognition.lang="id-ID";voiceRecognition.continuous=true;voiceRecognition.interimResults=true;voiceRecognition.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)voiceFinalTranscript+=(voiceFinalTranscript?" ":"")+res[0].transcript.trim();else interim+=res[0].transcript}updateVoiceOverlayTranscript(interim)};voiceRecognition.onerror=e=>{if(e.error==="no-speech")return;if(e.error==="not-allowed"||e.error==="service-not-allowed"){removeVoiceOverlay();alert("Akses mikrofon ditolak. Izinkan akses mikrofon di pengaturan browser untuk memakai fitur ini.");return}console.warn("Voice recognition error",e.error)};voiceRecognition.onend=()=>{const btn=document.getElementById("voiceStopBtn");if(btn)btn.textContent="🎙️ Lanjutkan / Selesai"};renderVoiceListeningOverlay(kind);try{voiceRecognition.start()}catch(e){console.warn(e)}}
function renderVoiceListeningOverlay(kind){const label=kind==="material"?"material":"peralatan";const el=document.createElement("div");el.className="voice-overlay";el.id="voiceOverlay";el.innerHTML=`<div class="voice-panel"><div class="voice-mic-pulse">🎤</div><div class="voice-hint">Mendengarkan... sebutkan daftar ${label} (nama, jumlah, satuan)</div><div class="voice-hint" style="font-style:italic">cth: "semen lima puluh sak, besi sepuluh batang"</div><div class="voice-transcript" id="voiceFinalText">(belum ada suara terdeteksi)</div><div class="voice-transcript interim" id="voiceInterimText"></div><div class="voice-actions"><button class="btn" type="button" onclick="closeVoiceOverlay()">Batal</button><button class="btn primary" type="button" id="voiceStopBtn" onclick="stopVoiceFill()">Selesai</button></div></div>`;document.body.appendChild(el)}
function updateVoiceOverlayTranscript(interim){const finalEl=document.getElementById("voiceFinalText"),interimEl=document.getElementById("voiceInterimText");if(finalEl)finalEl.textContent=voiceFinalTranscript||"(belum ada suara terdeteksi)";if(interimEl)interimEl.textContent=interim}
function stopVoiceFill(){if(voiceRecognition){try{voiceRecognition.stop()}catch(e){}}const kind=voiceTargetKind;const transcript=voiceFinalTranscript.trim();removeVoiceOverlay();if(!transcript){alert("Tidak ada suara yang terekam. Coba lagi.");return}const{parsed,skipped}=parseVoiceItems(transcript);showVoiceReviewScreen(kind,parsed,skipped,transcript)}
function closeVoiceOverlay(){if(voiceRecognition){try{voiceRecognition.stop()}catch(e){}}removeVoiceOverlay()}
function removeVoiceOverlay(){const el=document.getElementById("voiceOverlay");if(el)el.remove()}
function showVoiceReviewScreen(kind,parsed,skipped,rawTranscript){const label=kind==="material"?"Material":"Peralatan";const el=document.createElement("div");el.className="voice-overlay";el.id="voiceOverlay";const rowsHtml=parsed.map((item,i)=>`<div class="voice-review-row"><input type="checkbox" checked data-voice-check="${i}"><input class="input small" data-voice-name="${i}" value="${esc(item.name)}" placeholder="Nama"><input class="input small" type="number" step="any" data-voice-qty="${i}" value="${esc(item.qty)}" placeholder="Qty"><input class="input small" data-voice-unit="${i}" value="${esc(item.unit)}" placeholder="Satuan"></div>`).join("");el.innerHTML=`<div class="voice-panel"><div class="voice-hint" style="font-weight:800;font-size:14px;color:#111;text-align:left">Hasil: ${parsed.length} ${label.toLowerCase()} terdeteksi</div><div class="voice-hint" style="text-align:left;margin-top:4px">Periksa dan edit sebelum ditambahkan ke tabel:</div><div style="margin-top:10px">${rowsHtml||'<p class="muted">Tidak ada item yang berhasil dikenali.</p>'}</div>${skipped.length?`<div class="voice-skipped">Tidak terbaca (${skipped.length}): ${skipped.map(s=>esc(s)).join("; ")}</div>`:""}<div class="voice-hint" style="margin-top:12px;text-align:left"><b>Transkrip mentah:</b> ${esc(rawTranscript)}</div><div class="voice-actions"><button class="btn" type="button" onclick="closeVoiceOverlay()">Batal</button><button class="btn primary" type="button" onclick="applyVoiceReview('${kind}',${parsed.length})">Tambahkan ke Tabel</button></div></div>`;document.body.appendChild(el)}
function applyVoiceReview(kind,count){const r=ensureDailyDraft();if(!r)return;captureLiveDailyFields(r);const newItems=[];for(let i=0;i<count;i++){const checkEl=document.querySelector(`[data-voice-check="${i}"]`);if(!checkEl||!checkEl.checked)continue;const name=document.querySelector(`[data-voice-name="${i}"]`)?.value||"";const qty=document.querySelector(`[data-voice-qty="${i}"]`)?.value||"";const unit=document.querySelector(`[data-voice-unit="${i}"]`)?.value||"";if(!String(name).trim())continue;if(kind==="material")newItems.push({id:uid("mat"),name:name.trim(),qty,unit,supplier:"",note:""});else newItems.push({id:uid("eq"),name:name.trim(),qty,unit,status:"Milik Sendiri",note:""})}if(kind==="material")r.materials=[...materialsOf(r),...newItems];else r.equipments=[...equipmentsOf(r),...newItems];removeVoiceOverlay();save();render()}

function formatQty(n){return new Intl.NumberFormat("id-ID",{maximumFractionDigits:2}).format(Number(n)||0)}
function generateWeeklyMaterialSummary(dailyReports){const map=new Map();(dailyReports||[]).forEach(r=>{materialsOf(r).forEach(m=>{const key=normalizeItemName(m.name);if(!key)return;if(!map.has(key))map.set(key,{key,nameCounts:new Map(),unit:"",qtyTotal:0,days:new Set()});const g=map.get(key);g.nameCounts.set(m.name,(g.nameCounts.get(m.name)||0)+1);g.qtyTotal+=Number(m.qty)||0;if(!g.unit)g.unit=m.unit||"";g.days.add(m.date||r.date)})});return[...map.values()].map(g=>({name:[...g.nameCounts.entries()].sort((a,b)=>b[1]-a[1])[0][0],qtyTotal:g.qtyTotal,unit:g.unit||"-",days:g.days.size})).sort((a,b)=>b.qtyTotal-a.qtyTotal)}
function generateWeeklyEquipmentSummary(dailyReports){const map=new Map();(dailyReports||[]).forEach(r=>{equipmentsOf(r).forEach(e=>{const key=normalizeItemName(e.name);if(!key)return;if(!map.has(key))map.set(key,{key,nameCounts:new Map(),unit:"",qtyMax:0,days:new Set(),lastStatus:e.status||""});const g=map.get(key);g.nameCounts.set(e.name,(g.nameCounts.get(e.name)||0)+1);g.qtyMax=Math.max(g.qtyMax,Number(e.qty)||0);if(!g.unit)g.unit=e.unit||"";g.days.add(e.date||r.date);g.lastStatus=e.status||g.lastStatus})});return[...map.values()].map(g=>({name:[...g.nameCounts.entries()].sort((a,b)=>b[1]-a[1])[0][0],qtyMax:g.qtyMax,unit:g.unit||"-",days:g.days.size,status:g.lastStatus})).sort((a,b)=>b.days-a.days)}
function normalizeWeekly(w){return{...w,projectId:w.projectId||"",periodStart:w.periodStart||w.startDate||today(),periodEnd:w.periodEnd||w.endDate||today(),weekLabel:w.weekLabel||`Weekly ${fmtDate(w.startDate||w.periodStart)} - ${fmtDate(w.endDate||w.periodEnd)}`,sourceDailyReportIds:w.sourceDailyReportIds||w.includedDailyReportIds||[],autoSummary:w.autoSummary||w.generatedSummary?.autoSummary||"",manualNotes:w.manualNotes||"",progressAttachment:w.progressAttachment||null,generatedAt:w.generatedAt||w.createdAt||new Date().toISOString(),updatedAt:w.updatedAt||w.createdAt||new Date().toISOString()}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw)db=JSON.parse(raw)}catch(e){console.warn("Load gagal",e)}db.projects=normalizeIdList(db.projects||[]).map(normalizeProjectRecord);db.surveys=normalizeIdList(db.surveys||[]);db.dailyReports=normalizeIdList((db.dailyReports||[]).map(normalizeDaily));db.weeklyReports=normalizeIdList((db.weeklyReports||[]).map(normalizeWeekly));db.appVersion=APP_VERSION;migrateDuplicateWeeklyProjects();db.weeklyReports=db.weeklyReports.filter(w=>getProjectById(w.projectId));db.dailyReports=db.dailyReports.filter(r=>getProjectById(r.projectId));if(!activeProjectId||!getProjectById(activeProjectId))activeProjectId=db.projects[0]?.id||"";save(false)}
function save(updateStatus=true){db.appVersion=APP_VERSION;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn("Gagal menyimpan ke local storage",e);lastSavedText="Gagal menyimpan otomatis (penyimpanan penuh/tidak tersedia)";renderHeaderStatus();return}if(updateStatus){lastSavedText=`Tersimpan ${new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}`;renderHeaderStatus()}}
function getProjectById(projectId){return db.projects.find(p=>p.id===projectId)||null}
function getSurveyById(surveyId){return db.surveys.find(s=>s.id===surveyId)||null}
function getDailyById(id){return db.dailyReports.find(r=>r.id===id)||null}
function getWeeklyById(id){return db.weeklyReports.find(w=>w.id===id)||null}
function getDailyReportsByProjectAndPeriod(projectId,startDate,endDate){if(!getProjectById(projectId))return[];return db.dailyReports.filter(r=>r.projectId===projectId&&(!startDate||r.date>=startDate)&&(!endDate||r.date<=endDate)).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}
function weeklyReportsForProject(projectId){return db.weeklyReports.filter(w=>w.projectId===projectId).sort((a,b)=>String(b.generatedAt).localeCompare(String(a.generatedAt)))}
function photosOf(r){return Array.isArray(r?.photos)?r.photos:[]}

function saveProject(fd){const explicitId=fd.get("id");const data={id:explicitId||uid("project"),name:String(fd.get("name")||"").trim(),location:fd.get("location")||"",owner:fd.get("owner")||"",estimator:fd.get("estimator")||"",team:fd.get("team")||"Tim STK",updatedAt:new Date().toISOString()};if(!data.name){alert("Nama proyek wajib diisi.");return null}const existing=explicitId?getProjectById(explicitId):findExistingProject(data);if(existing){Object.assign(existing,{...data,id:existing.id,createdAt:existing.createdAt||new Date().toISOString()});activeProjectId=existing.id}else{db.projects.push({...data,createdAt:new Date().toISOString()});activeProjectId=data.id}save();route="projects";render();return activeProjectId}

async function saveSurvey(fd){const id=fd.get("id")||uid("survey");let s=getSurveyById(id);const existingPhotos=s?.photos||[];const newPhotos=[];for(const file of fd.getAll("photos")){if(file&&file.size&&file.type.startsWith("image/")){const dataUrl=await imageToData(file);newPhotos.push({id:uid("photo"),url:dataUrl,caption:"",orientation:await getImageOrientation(dataUrl),takenAt:new Date().toISOString()})}}const data={id,surveyDate:fd.get("surveyDate")||today(),title:fd.get("title")||"",surveyData:fd.get("surveyData")||"",kendala:fd.get("kendala")||"",followUp:fd.get("followUp")||"",photos:[...existingPhotos,...newPhotos],status:s?.status||"survey_only",linkedProjectId:s?.linkedProjectId||null,linkedDailyReportId:s?.linkedDailyReportId||null,updatedAt:new Date().toISOString()};if(data.title){const p=ensureProjectFromSurvey(data);data.linkedProjectId=p.id;if(!data.linkedDailyReportId)data.status="project_registered"}if(s)Object.assign(s,data);else db.surveys.push({...data,createdAt:new Date().toISOString()});activeSurveyId=id;activeProjectId=data.linkedProjectId||activeProjectId;save();render()}
function createProjectFromSurvey(surveyId){const s=getSurveyById(surveyId);if(!s)return alert("Survey tidak ditemukan.");const p=ensureProjectFromSurvey(s);linkSurveyToProject(s.id,p.id);activeProjectId=p.id;save();render()}
function convertSurveyToDailyReport(surveyId,projectId){const s=getSurveyById(surveyId),p=getProjectById(projectId);if(!s)return alert("Survey tidak ditemukan.");if(!p)return alert("Pilih proyek terdaftar dulu.");const existing=s.linkedDailyReportId?getDailyById(s.linkedDailyReportId):null;const id=existing?.id||uid("daily");const daily={id,projectId:p.id,date:s.surveyDate||today(),sourceSurveyId:s.id,progress:s.surveyData||"",notes:s.title||"",kendala:s.kendala||"",followUp:s.followUp||"",documentationMeta:{weather:"Survey",workHours:"Survey",area:s.title||""},photos:(s.photos||[]).map((ph,i)=>({id:ph.id||uid("photo"),number:i+1,url:ph.url,caption:ph.caption||s.title||"",location:ph.location||"",orientation:ph.orientation||null,takenAt:ph.takenAt||new Date().toISOString(),includeWeekly:true})),createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(existing)Object.assign(existing,daily);else db.dailyReports.push(daily);Object.assign(s,{status:"added_to_daily_progress",linkedProjectId:p.id,linkedDailyReportId:id,updatedAt:new Date().toISOString()});activateProjectForDailyProgress(p.id,s.id);activeProjectId=p.id;editingDailyId=id;activeDate=daily.date;route="daily";save();render()}
function viewDaily(){const p=getProjectById(activeProjectId),r=editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate);return `<section><div class="toolbar"><div class="title"><h1>Daily Report</h1><p>Daily Report wajib memilih proyek yang sudah terdaftar.</p></div><div class="actions"><button class="btn primary" onclick="previewActiveDaily()" ${p?"":"disabled"}>Generate Daily PDF</button><button class="btn" data-go="weekly">Generate Weekly</button></div></div><div class="grid"><div class="card pad span5"><div class="field"><label>Pilih proyek</label>${projectSelectorHTML(activeProjectId,true)}</div>${p?projectSummary(p):`<div class="empty"><h3>Belum ada proyek</h3><p>Buat atau daftarkan proyek dulu. Daily tidak bisa dibuat tanpa proyek.</p><button class="btn primary" data-go="projects">Tambah Proyek</button></div>`}<div class="field" style="margin-top:12px"><label>Tanggal aktif</label><input class="input" type="date" value="${activeDate}" onchange="activeDate=this.value||today();editingDailyId='';render()"></div></div><div class="card pad span7">${p?dailyForm(r||blankDaily()):""}</div><div class="card pad span12">${p?dailyList(p.id):""}</div></div></section>`}

function materialEditor(r){const items=materialsOf(r);return `<div class="subsection"><div class="subhead"><label>Material Masuk Hari Ini</label><div style="display:flex;gap:6px"><button class="btn small" type="button" onclick="startVoiceFill('material')">🎤 Isi via Suara</button><button class="btn small" type="button" onclick="addMaterialRow()">+ Tambah Material</button></div></div><div class="item-table">${items.length?`<div class="item-row item-row-head"><span>Material</span><span>Qty</span><span>Satuan</span><span>Supplier</span><span>Keterangan</span><span></span></div>${items.map(m=>`<div class="item-row"><input class="input small" data-material-id="${m.id}" data-material-field="name" placeholder="Nama material" value="${esc(m.name||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="qty" type="number" step="any" inputmode="decimal" placeholder="Qty" value="${esc(m.qty??"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="unit" placeholder="Satuan" value="${esc(m.unit||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="supplier" placeholder="Supplier" value="${esc(m.supplier||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-material-id="${m.id}" data-material-field="note" placeholder="Keterangan" value="${esc(m.note||"")}" enterkeyhint="done" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><button class="btn small warn" type="button" onclick="removeMaterial('${m.id}')">Hapus</button></div>`).join("")}`:`<p class="muted">Belum ada material masuk hari ini.</p>`}</div></div>`}
function equipmentEditor(r){const items=equipmentsOf(r),statuses=["Milik Sendiri","Sewa","Subkon"];return `<div class="subsection"><div class="subhead"><label>Peralatan Digunakan Hari Ini</label><div style="display:flex;gap:6px"><button class="btn small" type="button" onclick="startVoiceFill('equipment')">🎤 Isi via Suara</button><button class="btn small" type="button" onclick="addEquipmentRow()">+ Tambah Peralatan</button></div><div class="item-table">${items.length?`<div class="item-row item-row-head"><span>Peralatan</span><span>Qty</span><span>Satuan</span><span>Status</span><span>Keterangan</span><span></span></div>${items.map(e=>`<div class="item-row"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="name" placeholder="Nama peralatan" value="${esc(e.name||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="qty" type="number" step="any" inputmode="decimal" placeholder="Qty" value="${esc(e.qty??"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-equipment-id="${e.id}" data-equipment-field="unit" placeholder="Satuan" value="${esc(e.unit||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><select class="select small" data-equipment-id="${e.id}" data-equipment-field="status" onkeydown="handleItemFieldKey(event,this)">${statuses.map(s=>`<option value="${s}" ${e.status===s?"selected":""}>${s}</option>`).join("")}</select><input class="input small" data-equipment-id="${e.id}" data-equipment-field="note" placeholder="Keterangan" value="${esc(e.note||"")}" enterkeyhint="done" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><button class="btn small warn" type="button" onclick="removeEquipment('${e.id}')">Hapus</button></div>`).join("")}`:`<p class="muted">Belum ada peralatan digunakan hari ini.</p>` function weatherEditor(r){const items=weatherOf(r);return `<div class="subsection"><div class="subhead"><label>Cuaca (bisa lebih dari satu, cth. Pagi/Siang/Sore)</label><button class="btn small" type="button" onclick="addWeatherRow()">+ Tambah Cuaca</button></div>${items.length?items.map(w=>`<div class="weather-row"><input class="input small" data-weather-id="${w.id}" data-weather-field="label" placeholder="Waktu (mis. Pagi)" value="${esc(w.label||"")}" enterkeyhint="next" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><input class="input small" data-weather-id="${w.id}" data-weather-field="condition" list="weatherConditions" placeholder="Kondisi cuaca" value="${esc(w.condition||"")}" enterkeyhint="done" onkeydown="handleItemFieldKey(event,this)" onfocus="this.select()"><button class="btn small warn" type="button" onclick="removeWeatherRow('${w.id}')">Hapus</button></div>`).join(""):`<p class="muted">Belum ada catatan cuaca.</p>`}<datalist id="weatherConditions"><option value="Cerah"><option value="Berawan"><option value="Mendung"><option value="Hujan Ringan"><option value="Hujan Sedang"><option value="Hujan Deras"><option value="Berkabut"><option value="Angin Kencang"></datalist></div>`}
const ITEM_FIELD_ORDER={material:["name","qty","unit","supplier","note"],equipment:["name","qty","unit","status","note"],weather:["label","condition"]};
const ITEM_ADD_FN={material:()=>addMaterialRow(),equipment:()=>addEquipmentRow(),weather:()=>addWeatherRow()};
function handleItemFieldKey(e,el){if(e.key!=="Enter")return;e.preventDefault();let kind=null,field=null;if(el.dataset.materialField!==undefined){kind="material";field=el.dataset.materialField}else if(el.dataset.equipmentField!==undefined){kind="equipment";field=el.dataset.equipmentField}else if(el.dataset.weatherField!==undefined){kind="weather";field=el.dataset.weatherField}if(!kind)return;const order=ITEM_FIELD_ORDER[kind];const idx=order.indexOf(field);const row=el.closest(".item-row,.weather-row");if(row&&idx>-1&&idx<order.length-1){const nextEl=row.querySelector(`[data-${kind}-field="${order[idx+1]}"]`);if(nextEl){nextEl.focus();if(typeof nextEl.select==="function")nextEl.select();return}}const fn=ITEM_ADD_FN[kind];if(fn)fn()}
function addWeatherRow(){const r=ensureDailyDraft();if(!r)return;captureLiveDailyFields(r);r.documentationMeta=r.documentationMeta||{};r.documentationMeta.weatherEntries=[...weatherOf(r),{id:uid("wthr"),label:"",condition:""}];save();render();focusLastField('[data-weather-field="label"]')}
function removeWeatherRow(id){const r=currentDailyRecord();if(!r)return;captureLiveDailyFields(r);r.documentationMeta=r.documentationMeta||{};r.documentationMeta.weatherEntries=weatherOf(r).filter(w=>w.id!==id);save();render()}
function captureWeatherRows(list){$$("[data-weather-field]").forEach(el=>{const row=list.find(w=>w.id===el.dataset.weatherId);if(row)row[el.dataset.weatherField]=el.value})}
function autosaveDailyDraft(){const form=document.getElementById("dailyForm");if(!form)return;const r=ensureDailyDraft();if(!r)return;const fd=new FormData(form);r.progress=fd.get("progress")||"";r.notes=fd.get("notes")||"";r.kendala=fd.get("kendala")||"";r.followUp=fd.get("followUp")||"";r.documentationMeta=r.documentationMeta||{};r.documentationMeta.workHours=fd.get("workHours")||"";r.documentationMeta.area=fd.get("area")||"";if(fd.get("inputBy"))r.inputBy=fd.get("inputBy");capturePhotoCaptions(photosOf(r));captureMaterialRows(materialsOf(r));captureEquipmentRows(equipmentsOf(r));captureWeatherRows(weatherOf(r));r.updatedAt=new Date().toISOString();save()}
function ensureDailyDraft(){let r=editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate);if(!r){if(!getProjectById(activeProjectId)){alert("Pilih proyek terlebih dahulu.");return null}const id=uid("daily"),date=activeDate,projectId=activeProjectId;r={...blankDaily(),id,projectId,date,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};r.reportId=generateDailyReportId(projectId,date);db.dailyReports.push(r);editingDailyId=id}return r}
function currentDailyRecord(){return editingDailyId?getDailyById(editingDailyId):db.dailyReports.find(x=>x.projectId===activeProjectId&&x.date===activeDate)}
function captureMaterialRows(list){$$("[data-material-field]").forEach(el=>{const row=list.find(m=>m.id===el.dataset.materialId);if(row)row[el.dataset.materialField]=el.value})}
function captureEquipmentRows(list){$$("[data-equipment-field]").forEach(el=>{const row=list.find(x=>x.id===el.dataset.equipmentId);if(row)row[el.dataset.equipmentField]=el.value})}
function captureLiveDailyFields(r){if(!r)return;const form=document.getElementById("dailyForm");if(form){const fd=new FormData(form);if(fd.has("progress"))r.progress=fd.get("progress");if(fd.has("notes"))r.notes=fd.get("notes");if(fd.has("kendala"))r.kendala=fd.get("kendala");if(fd.has("followUp"))r.followUp=fd.get("followUp");if(fd.has("workHours")||fd.has("area")){r.documentationMeta=r.documentationMeta||{};if(fd.has("workHours"))r.documentationMeta.workHours=fd.get("workHours");if(fd.has("area"))r.documentationMeta.area=fd.get("area")}}capturePhotoCaptions(photosOf(r));captureMaterialRows(materialsOf(r));captureEquipmentRows(equipmentsOf(r));captureWeatherRows(weatherOf(r))}
function addMaterialRow(){const r=ensureDailyDraft();if(!r)return;captureLiveDailyFields(r);r.materials=[...materialsOf(r),{id:uid("mat"),name:"",qty:"",unit:"",supplier:"",note:""}];save();render();focusLastField('[data-material-field="name"]')}
function removeMaterial(id){const r=currentDailyRecord();if(!r)return;captureLiveDailyFields(r);r.materials=materialsOf(r).filter(m=>m.id!==id);save();render()}
function addEquipmentRow(){const r=ensureDailyDraft();if(!r)return;captureLiveDailyFields(r);r.equipments=[...equipmentsOf(r),{id:uid("eq"),name:"",qty:"",unit:"",status:"Milik Sendiri",note:""}];save();render();focusLastField('[data-equipment-field="name"]')}
function focusLastField(selector){requestAnimationFrame(()=>{const list=$$(selector);const el=list[list.length-1];if(!el)return;el.focus();if(typeof el.value==="string"&&el.setSelectionRange){try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}})}
function removeEquipment(id){const r=currentDailyRecord();if(!r)return;captureLiveDailyFields(r);r.equipments=equipmentsOf(r).filter(e=>e.id!==id);save();render()}
function photoEditor(r){const photos=photosOf(r);return `<div class="photo-grid">${photos.map(ph=>`<article class="photo-card"><img src="${ph.url}" alt=""><div class="body"><textarea class="textarea" data-photo-caption="${ph.id}" placeholder="Caption">${esc(ph.caption||"")}</textarea><input class="input" data-photo-location="${ph.id}" placeholder="Lokasi foto" value="${esc(ph.location||"")}"><label class="chip"><input type="checkbox" data-photo-weekly="${ph.id}" ${ph.includeWeekly!==false?"checked":""}> Include weekly</label><button class="btn small warn" type="button" onclick="removePhoto('${ph.id}')">Hapus</button></div></article>`).join("")||`<p class="muted">Belum ada foto.</p>`}</div>`}
function dailyList(projectId){const items=getDailyReportsByProjectAndPeriod(projectId),p=getProjectById(projectId);return `<h2 style="margin-top:0">Daily Report Proyek</h2><div class="list">${items.map(r=>`<article class="row"><div><h3>${fmtDate(r.date)} ${r.sourceSurveyId?'<span class="chip">Dari Survey</span>':""}</h3><p>${esc(trim(r.progress||"-"))}</p><div class="meta"><span class="chip">${photosOf(r).length} foto</span><span class="chip">${esc(p?.name||"Proyek")}</span></div></div><div class="actions"><button class="btn small primary" onclick="openDailyReport('${r.id}')">Preview</button><button class="btn small" onclick="editDailyReport('${r.id}')">Edit</button><button class="btn small warn" onclick="deleteDailyReport('${r.id}')">Hapus</button></div></article>`).join("")||`<div class="empty"><h3>Belum ada Daily Report</h3><p>Isi form untuk proyek ini.</p></div>`}</div>`}
async function saveDailyReport(fd){const projectId=activeProjectId;if(!getProjectById(projectId)){alert("Daily Report wajib memilih existing project.");return}const id=fd.get("id")||editingDailyId||uid("daily");let r=getDailyById(id);const date=fd.get("date")||activeDate;const reportId=r?.reportId||generateDailyReportId(projectId,date,id);const inputBy=fd.get("inputBy")||r?.inputBy||"";const nowIso=new Date().toISOString();const currentPhotos=photosOf(r);capturePhotoCaptions(currentPhotos);const currentMaterials=materialsOf(r);captureMaterialRows(currentMaterials);const currentEquipments=equipmentsOf(r);captureEquipmentRows(currentEquipments);const currentWeather=weatherOf(r);captureWeatherRows(currentWeather);const cleanWeather=currentWeather.filter(w=>String(w.label||"").trim()||String(w.condition||"").trim()).map(w=>({id:w.id,label:(w.label||"").trim(),condition:(w.condition||"").trim()}));const newPhotos=[];for(const file of fd.getAll("photos")){if(file&&file.size&&file.type.startsWith("image/")){const dataUrl=await imageToData(file);newPhotos.push({id:uid("photo"),number:currentPhotos.length+newPhotos.length+1,url:dataUrl,caption:"",location:fd.get("area")||"",orientation:await getImageOrientation(dataUrl),takenAt:new Date().toISOString(),includeWeekly:true})}}const data={id,reportId,inputBy,projectId,date,sourceSurveyId:fd.get("sourceSurveyId")||r?.sourceSurveyId||null,progress:fd.get("progress")||"",notes:fd.get("notes")||"",kendala:fd.get("kendala")||"",followUp:fd.get("followUp")||"",documentationMeta:{weatherEntries:cleanWeather,weather:cleanWeather.map(w=>w.label?`${w.label}: ${w.condition}`:w.condition).join(", "),workHours:fd.get("workHours")||"",area:fd.get("area")||""},photos:[...currentPhotos,...newPhotos].map((p,i)=>({...p,number:i+1})),materials:currentMaterials.filter(m=>String(m.name||"").trim()).map(m=>({...m,name:String(m.name).trim(),qty:Number(m.qty)||0,unit:(m.unit||"").trim(),supplier:(m.supplier||"").trim(),note:(m.note||"").trim(),date,projectId,reportId,inputBy,inputAt:m.inputAt||nowIso})),equipments:currentEquipments.filter(e=>String(e.name||"").trim()).map(e=>({...e,name:String(e.name).trim(),qty:Number(e.qty)||0,unit:(e.unit||"").trim(),status:e.status||"Milik Sendiri",note:(e.note||"").trim(),date,projectId,reportId,inputBy,inputAt:e.inputAt||nowIso})),createdAt:r?.createdAt||nowIso,updatedAt:nowIso};if(!data.progress&&!confirm("Progress detail kosong. Tetap simpan?"))return;if(r)Object.assign(r,data);else db.dailyReports.push(data);editingDailyId=id;activeDate=data.date;save();render();if(newPhotos.length)focusLastField('[data-photo-caption]')}
function capturePhotoCaptions(list){$$("[data-photo-caption]").forEach(el=>{const ph=list.find(p=>p.id===el.dataset.photoCaption);if(ph)ph.caption=el.value});$$("[data-photo-location]").forEach(el=>{const ph=list.find(p=>p.id===el.dataset.photoLocation);if(ph)ph.location=el.value});$$("[data-photo-weekly]").forEach(el=>{const ph=list.find(p=>p.id===el.dataset.photoWeekly);if(ph)ph.includeWeekly=el.checked})}
function editDailyReport(id){const r=getDailyById(id);if(!r)return;activeProjectId=r.projectId;editingDailyId=id;activeDate=r.date;route="daily";render()}
async function ensurePhotoOrientations(r){if(!r)return;const missing=photosOf(r).filter(p=>!p.orientation&&p.url);if(!missing.length)return;for(const p of missing){p.orientation=await getImageOrientation(p.url)}save()}

function splitText(v,max=760){const s=String(v||"-").trim()||"-";if(s.length<=max)return[s];const parts=[];let rest=s;while(rest.length>max){let cut=rest.lastIndexOf("\n",max);if(cut<max*.45)cut=rest.lastIndexOf(". ",max);if(cut<max*.45)cut=rest.lastIndexOf(" ",max);if(cut<max*.45)cut=max;parts.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim()}if(rest)parts.push(rest);return parts}
function weeklySummaryPages(w,s,p){const cards=[{title:"Progress Mingguan",html:`${summaryList("Progress Summary",s.progressItems)}${summaryList("Notes",s.notesItems)}`},{title:"Summary Mingguan",text:w.autoSummary||s.autoSummary},{title:"Notes / Logs / Kendala",html:summaryList("Kendala Summary",s.kendalaItems)},{title:"Follow-up / Tindak Lanjut",html:summaryList("Follow-up Summary",s.followUpItems)}].flatMap(card=>card.html?[card]:splitText(card.text,760).map((text,i)=>({title:i?`${card.title} - Lanjutan`:card.title,text})));const pages=[];while(cards.length){const chunk=cards.splice(0,2);pages.push(`<section class="paper"><h2>${pages.length?"Ringkasan Mingguan - Lanjutan":"Ringkasan Mingguan"}</h2><p>${fmtDate(w.periodStart)} - ${fmtDate(w.periodEnd)}</p>${chunk.map(c=>c.html?`<div class="pdf-section"><h3>${esc(c.title)}</h3>${c.html}</div>`:section(c.title,c.text)).join("")}${footerHtml(p?.name,w.periodEnd)}</section>`)}return pages.join("")}
function dailyTablePage(w,s){const ds=s.dailySnapshots||[];return `<section class="paper"><h2>Daily Reports Source</h2><table class="daily-table"><thead><tr><th>Daily Report</th><th>Progress</th><th>Kendala</th><th>Follow-up</th></tr></thead><tbody>${ds.map(r=>`<tr><td>${esc(dailyDisplayName(r))}</td><td>${esc(r.progress||"-")}</td><td>${esc(r.kendala||"-")}</td><td>${esc(r.followUp||"-")}</td></tr>`).join("")}</tbody></table>${footerHtml(getProjectById(w.projectId)?.name,w.periodEnd)}</section>`}
function section(title,text){return `<div class="pdf-section"><h3>${esc(title)}</h3><p>${esc(text||"-")}</p></div>`}
function summaryList(title,items=[]){if(!items.length)return section(title,"-");return `<div class="pdf-section"><h3>${esc(title)}</h3><ul>${items.map(x=>`<li><b>${fmtDate(x.date)}:</b> ${esc(x.text)}</li>`).join("")}</ul></div>`}
function photoBlock(ph,date,area){if(!ph)return `<article class="photo-block" style="visibility:hidden"><div></div><div></div></article>`;return `<article class="photo-block"><div class="photo-frame"><img src="${ph.url}"><div class="watermark">${compactDateTime(ph.takenAt)} | ${fmtDate(date)}</div></div><div><h3>Foto No. ${String(ph.number||1).padStart(2,"0")}</h3><p><b>Tanggal:</b> ${fmtDate(date)}</p><p><b>Area:</b> ${esc(area||"-")}</p><p><b>Caption:</b><br>${esc(ph.caption||"-")}</p></div></article>`}
function attachmentReportPages(w){const a=w.progressAttachment,p=getProjectById(w.projectId);if(!a)return"";if(a.renderedPages?.length)return a.renderedPages.map((src,i)=>`<section class="paper pdf-attachment-page"><div class="kicker">Lampiran Progress</div><h2>Dokumen Progress${a.renderedPages.length>1?` - Halaman ${i+1}`:""}</h2><p class="muted">${esc(a.name)}</p><img src="${src}" alt="Lampiran progress halaman ${i+1}">${footerHtml(p?.name,w.periodEnd)}</section>`).join("");return `<section class="paper"><div class="kicker">Lampiran Progress</div><h2>Dokumen Progress</h2><p>${esc(a.name)}</p>${attachmentPreview(a)}${footerHtml(p?.name,w.periodEnd)}</section>`}
function attachmentPreview(a){if(a.renderStatus==="rendering")return `<div class="attachment-box"><strong>Menyiapkan lampiran PDF...</strong><p>PDF sedang dirender menjadi gambar agar ikut tampil di export.</p></div>`;if(a.renderStatus==="failed")return `<div class="attachment-box"><strong>PDF gagal dirender</strong><p>${esc(a.renderError||"Coba buka ulang preview saat internet aktif.")}</p></div>`;return `<div class="attachment-box"><strong>Menyiapkan lampiran PDF...</strong><p>Jika belum tampil, tunggu sebentar atau buka ulang preview.</p></div>`}
function dataUrlToBytes(dataUrl){const raw=atob(String(dataUrl||"").split(",")[1]||""),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return bytes}
function loadPdfJs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);return new Promise((res,rej)=>{const existing=document.querySelector('script[data-pdfjs]');if(existing){existing.addEventListener("load",()=>res(window.pdfjsLib),{once:true});existing.addEventListener("error",rej,{once:true});return}const s=document.createElement("script");s.dataset.pdfjs="1";s.src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js";s.onload=()=>window.pdfjsLib?res(window.pdfjsLib):rej(new Error("PDF.js tidak tersedia"));s.onerror=()=>{s.remove();rej(new Error("Gagal memuat PDF.js."))};document.head.appendChild(s)})}
async function renderPdfDataUrlToImages(dataUrl){const pdfjs=await loadPdfJs();const doc=await pdfjs.getDocument({data:dataUrlToBytes(dataUrl),disableWorker:true}).promise;const pages=[];for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i),base=page.getViewport({scale:1}),scale=Math.min(3,1800/base.width),viewport=page.getViewport({scale});const canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport}).promise;pages.push(canvas.toDataURL("image/jpeg",.9))}return pages}
async function ensureWeeklyPdfRendered(id){const w=getWeeklyById(id),a=w?.progressAttachment;if(!a||!String(a.type||"").includes("pdf")||a.renderedPages?.length||pdfRenderJobs.has(id))return;pdfRenderJobs.add(id);a.renderStatus="rendering";a.renderError="";save(false);try{a.renderedPages=await renderPdfDataUrlToImages(a.url);a.renderStatus="done";save(false)}catch(e){console.warn(e);a.renderStatus="failed";a.renderError=e.message||"PDF gagal dirender";save(false)}finally{pdfRenderJobs.delete(id);if(route==="weeklyPreview"&&previewWeeklyId===id)render()}}
function footerHtml(projectName,date){return `<footer class="pdf-footer"><span>PT. Solusi Teknologi Konstruksi</span><span>${esc(projectName||"Report")}</span><span>${fmtDate(date)}</span></footer>`}
function exportDailyPDF(id){const r=getDailyById(id),old=document.title;document.title=`Daily - ${cleanFile(getProjectById(r?.projectId)?.name)} - ${r?.date||today()}`;window.onafterprint=()=>{document.title=old;window.onafterprint=null};const ready=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,new Promise(res=>setTimeout(res,1500))]):new Promise(res=>setTimeout(res,60));ready.then(()=>{window.print();setTimeout(()=>{document.title=old},30000)})}
function generateWeeklyPdf(weeklyReportId){const w=getWeeklyById(weeklyReportId);if(w?.progressAttachment&&String(w.progressAttachment.type||"").includes("pdf")&&!w.progressAttachment.renderedPages?.length){ensureWeeklyPdfRendered(weeklyReportId);alert("Lampiran PDF progress sedang dirender menjadi gambar. Tunggu sampai halaman lampiran tampil, lalu export lagi.");return}const old=document.title;document.title=`Weekly - ${cleanFile(getProjectById(w?.projectId)?.name)} - ${w?.periodStart||today()} - ${w?.periodEnd||today()}`;window.onafterprint=()=>{document.title=old;window.onafterprint=null};setTimeout(()=>{window.print();setTimeout(()=>{document.title=old},30000)},120)}
function deleteWeekly(id){if(!confirm("Hapus Weekly Report ini?"))return;db.weeklyReports=db.weeklyReports.filter(w=>w.id!==id);save();render()}
function bindForms(){const projectForm=$("#projectForm");if(projectForm)projectForm.onsubmit=e=>{e.preventDefault();saveProject(new FormData(projectForm))};const surveyForm=$("#surveyForm");if(surveyForm)surveyForm.onsubmit=e=>{e.preventDefault();saveSurvey(new FormData(surveyForm)).catch(err=>alert(`Survey gagal disimpan: ${err.message}`))};const convertForm=$("#convertSurveyForm");if(convertForm)convertForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(convertForm);convertSurveyToDailyReport(fd.get("surveyId"),fd.get("projectId"))};const dailyForm=$("#dailyForm");if(dailyForm){dailyForm.oninput=()=>{lastSavedText="Ada perubahan belum disimpan";renderHeaderStatus();clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{try{autosaveDailyDraft()}catch(e){console.warn(e)}},1400)};dailyForm.onsubmit=e=>{e.preventDefault();saveDailyReport(new FormData(dailyForm)).catch(err=>alert(`Daily gagal disimpan: ${err.message}`))}}const weeklyForm=$("#weeklyForm");if(weeklyForm)weeklyForm.onsubmit=e=>{e.preventDefault();const fd=new FormData(weeklyForm),projectId=fd.get("projectId"),periodStart=fd.get("periodStart"),periodEnd=fd.get("periodEnd"),dailies=getDailyReportsByProjectAndPeriod(projectId,periodStart,periodEnd),progressPdf=fd.get("progressPdf");if(!dailies.length){alert("Tidak ada Daily Report untuk proyek dan periode ini.");return}saveWeeklyReport(projectId,periodStart,periodEnd,generateWeeklySummaryFromDailyReports(dailies),progressPdf).catch(err=>alert(`Weekly gagal disimpan: ${err.message}`))};const restore=$("#restoreInput");if(restore)restore.onchange=e=>restoreJSON(e.target.files?.[0])}
function backupJSON(){const payload={appVersion:APP_VERSION,projects:db.projects,surveys:db.surveys,dailyReports:db.dailyReports,weeklyReports:db.weeklyReports,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ics-report-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreJSON(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(!confirm("Restore akan mengganti semua data lokal report di browser ini. Lanjut?"))return;db={appVersion:incoming.appVersion||APP_VERSION,projects:incoming.projects||[],surveys:incoming.surveys||[],dailyReports:incoming.dailyReports||[],weeklyReports:incoming.weeklyReports||[]};activeProjectId=db.projects[0]?.id||"";activeSurveyId="";editingDailyId="";previewDailyId="";previewWeeklyId="";load();route="daily";render()}catch(e){alert(`Restore gagal: ${e.message}`)}}
function getImageOrientation(url){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img.naturalWidth>img.naturalHeight?"landscape":"portrait");img.onerror=()=>resolve("portrait");img.src=url})}
function imageToData(file,max=1200,q=.78){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*s));c.height=Math.max(1,Math.round(im.naturalHeight*s));c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.src=r.result};r.readAsDataURL(file)})}
function fileToData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>res(String(r.result||""));r.readAsDataURL(file)})}
window.addEventListener("error",e=>console.warn("App error",e.message));
load();render();
</script>
