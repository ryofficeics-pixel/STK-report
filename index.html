<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f0efe9">
<title>STK Daily Report</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#f0efe9;--surface:#fff;--surface2:#e8e7e0;--dark:#1a1a1a;--muted:#747061;--border:rgba(26,26,26,.14);--danger:#c0392b;--ok:#2d7a4a;--shadow:0 4px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--dark);font-family:"DM Sans",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}[...]
@media screen and (max-width:850px){.top-inner,.toolbar{display:grid}.nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.grid,.form,.snapshot,.cover-grid,.pdf-grid{grid-template-columns:[...]
@page{size:A4 portrait;margin:0}
@media print{html,body{margin:0!important;background:#fff!important}.top,.no-print{display:none!important}.page,.report-pages{padding:0!important;margin:0!important;width:auto!important;background:#ff[...]
.cover-logo{width:156px;height:156px;object-fit:contain;display:block;margin:0 0 14px}
.cover-title{margin-top:10px}
.pdf-attachment-page img{width:100%;max-height:245mm;object-fit:contain;display:block}
.attachment-box{border:1px solid #dedbd1;border-radius:14px;background:#fbfaf6;padding:18px;margin-top:12px}
.danger-zone{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.voice-overlay{position:fixed;inset:0;background:rgba(20,18,14,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.voice-overlay{align-items:center}}
.voice-panel{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:640px){.voice-panel{border-radius:18px}}
.voice-mic-pulse{width:64px;height:64px;border-radius:50%;background:#e8503a;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;animation:voicePulse 1.4s ease-in-[...]
@keyframes voicePulse{0%{box-shadow:0 0 0 0 rgba(232,80,58,.45)}70%{box-shadow:0 0 0 18px rgba(232,80,58,0)}100%{box-shadow:0 0 0 0 rgba(232,80,58,0)}}
.voice-transcript{min-height:60px;background:#f4f2ec;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;color:#333;margin:12px 0;white-space:pre-wrap}
.voice-transcript.interim{color:#8f8b80;font-style:italic}
.voice-hint{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.voice-review-row{display:grid;grid-template-columns:auto 1fr .6fr .6fr;gap:6px;align-items:center;margin-bottom:6px}
.voice-review-row input[type="checkbox"]{width:18px;height:18px}
.voice-skipped{font-size:12px;color:#a15b3a;background:#fdf3ea;border-radius:8px;padding:8px 10px;margin-top:10px}
.voice-actions{display:flex;gap:8px;margin-top:16px}
.voice-actions .btn{flex:1}
</style>
</head>
<body>
<div id="app"></div>
